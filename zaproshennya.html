<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Підтвердження профілю — МитнийБрокер</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.preview{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.25rem}
.pv-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:1rem}
.svc-pick{display:flex;align-items:center;gap:8px;background:var(--surface);border:.5px solid var(--border);
  border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;font-size:13px}
.svc-pick.on{background:var(--blue-glow);border-color:var(--blue)}
.steps-note{background:var(--surface2);border-radius:var(--r-sm);padding:1rem 1.15rem;font-size:13px;
  color:var(--muted);line-height:1.7;margin-bottom:1.5rem}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/">Митний<span>Брокер</span></a>
  <div class="nav-actions"><a class="btn btn-ghost btn-sm" href="/">Каталог</a></div>
</nav>

<div class="page">
  <div class="wrap" id="app">
    <div class="empty">Перевіряємо запрошення…</div>
  </div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/db.js"></script>
<script>
let broker = null;

function invalid(msg){
  document.getElementById('app').innerHTML =
    '<div class="card" style="text-align:center;padding:2.5rem 1.5rem">' +
    '<div style="font-size:34px;margin-bottom:12px">🔗</div>' +
    '<h1 class="h-sm" style="margin-bottom:8px">Посилання не спрацювало</h1>' +
    '<p class="text-sm text-muted" style="line-height:1.7">' + msg + '</p>' +
    '<div class="row" style="justify-content:center;margin-top:1.5rem">' +
      '<a class="btn btn-ghost" href="/">На головну</a>' +
      '<a class="btn btn-primary" href="mailto:' + CONTACTS.email + '">Написати нам</a>' +
    '</div></div>';
}

function render(){
  const svcs = broker.broker_services || [];
  document.getElementById('app').innerHTML =
    '<div style="text-align:center;margin-bottom:1.75rem">' +
      '<h1 class="h-sm" style="font-size:24px;margin-bottom:8px">Ваш профіль готовий</h1>' +
      '<p class="text-sm text-muted">Перевірте дані, встановіть пароль — і профіль з\'явиться в каталозі</p>' +
    '</div>' +

    '<div class="steps-note">' +
      'Ми підготували профіль на основі відкритих даних про вашу компанію. ' +
      'Доки ви не підтвердите його, він <strong>не показується</strong> клієнтам і не приймає заявок. ' +
      'Розміщення безкоштовне, комісії із заявок немає.' +
    '</div>' +

    '<div class="preview">' +
      '<div class="pv-top">' +
        '<div class="avatar av-free">' + esc(initials(broker.name)) + '</div>' +
        '<div><div style="font-size:17px;font-weight:500">' + esc(broker.name) + '</div>' +
        '<div class="text-sm text-muted">' + esc([broker.city, broker.region].filter(Boolean).join(', ') || 'Регіон не вказано') + '</div></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label class="label" for="f-name">Назва в каталозі *</label><input class="input" id="f-name" value="' + esc(broker.name) + '"></div>' +
        '<div class="field"><label class="label" for="f-city">Місто</label><input class="input" id="f-city" value="' + esc(broker.city || '') + '"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label class="label" for="f-region">Область</label><select class="input" id="f-region"></select></div>' +
        '<div class="field"><label class="label" for="f-exp">Досвід, років</label><input class="input" type="number" id="f-exp" min="0" max="60" value="' + esc(broker.experience || '') + '"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label class="label" for="f-phone">Телефон</label><input class="input" id="f-phone" value="' + esc(broker.phone || '') + '" placeholder="+380…"></div>' +
        '<div class="field"><label class="label" for="f-tg">Telegram</label><input class="input" id="f-tg" value="' + esc(broker.telegram || '') + '" placeholder="@username"></div>' +
      '</div>' +
      '<div class="field"><label class="label" for="f-about">Про себе</label>' +
        '<textarea class="input" id="f-about" placeholder="Коротко про досвід і спеціалізацію…">' + esc(broker.about || '') + '</textarea></div>' +
      '<div class="field"><span class="label">Послуги</span>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="svcGrid">' +
          SERVICES.map(s => '<div class="svc-pick ' + (svcs.some(x => x.name === s.name) ? 'on' : '') +
            '" data-name="' + s.name + '" onclick="this.classList.toggle(\'on\')">' +
            '<span>' + s.icon + '</span><span>' + s.name + '</span></div>').join('') +
        '</div></div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">Пароль для входу</div>' +
      '<div class="field"><label class="label" for="f-pass">Придумайте пароль * (мінімум 8 символів)</label>' +
        '<input class="input" type="password" id="f-pass" autocomplete="new-password" placeholder="••••••••"></div>' +
      '<div class="check-row">' +
        '<input type="checkbox" id="f-agree">' +
        '<label for="f-agree">Підтверджую, що дані достовірні, і погоджуюсь з ' +
          '<a href="/terms" target="_blank" rel="noopener">публічною офертою</a> та ' +
          '<a href="/terms#privacy" target="_blank" rel="noopener">обробкою персональних даних</a></label>' +
      '</div>' +
      '<div class="msg" id="msg"></div>' +
      '<button class="btn btn-primary btn-block" id="btn" onclick="publish()">Опублікувати профіль</button>' +
      '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="decline()">Я не хочу розміщувати профіль</button>' +
    '</div>';

  document.getElementById('f-region').innerHTML =
    '<option value="">Оберіть область</option>' + REGIONS.map(r =>
      '<option ' + (broker.region === r ? 'selected' : '') + '>' + r + '</option>').join('');
}

async function publish(){
  const sb = await sbReady();
  const v = id => document.getElementById(id).value.trim();
  const m = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const pass = document.getElementById('f-pass').value;

  if (v('f-name').length < 2) return fail(m, 'Вкажіть назву для каталогу');
  if (pass.length < 8)        return fail(m, 'Пароль має містити щонайменше 8 символів');
  if (!document.getElementById('f-agree').checked)
    return fail(m, 'Підтвердьте згоду з офертою');

  btn.disabled = true; btn.textContent = 'Публікуємо…';
  try{
    const { error: passErr } = await sb.auth.updateUser({ password: pass });
    if (passErr) throw new Error('Не вдалося зберегти пароль: ' + passErr.message);

    const { error: updErr } = await sb.from('brokers').update({
      name:       v('f-name'),
      city:       v('f-city') || null,
      region:     document.getElementById('f-region').value || null,
      experience: Number(v('f-exp')) || 0,
      phone:      v('f-phone') || null,
      telegram:   v('f-tg') || null,
      about:      v('f-about') || null,
      is_active:  true,
      claimed_at: new Date().toISOString()
    }).eq('id', broker.id);
    if (updErr) throw new Error('Не вдалося зберегти профіль: ' + updErr.message);

    const chosen = [...document.querySelectorAll('#svcGrid .svc-pick.on')].map(el => el.dataset.name);
    if (chosen.length) await setMyServices(broker.id, chosen.map(n => ({ name:n })));

    track('sign_up', { method:'invite' });
    location.href = '/kabinet';
  }catch(e){
    fail(m, e.message);
    btn.disabled = false; btn.textContent = 'Опублікувати профіль';
  }
}

function fail(el, text){ el.className = 'msg show msg-err'; el.textContent = text; }

function decline(){
  if (!confirm('Профіль не буде опубліковано, і ми більше не звертатимемось.\n\nПродовжити?')) return;
  location.href = 'mailto:' + CONTACTS.email + '?subject=' +
    encodeURIComponent('Відмова від розміщення профілю') + '&body=' +
    encodeURIComponent('Прошу видалити підготовлений профіль та мої дані з платформи МитнийБрокер.');
}

window.addEventListener('DOMContentLoaded', async () => {
  await sbReady();
  // Сесія приходить із посилання в листі — SDK обробляє її сам,
  // але на це потрібна мить після завантаження.
  await new Promise(r => setTimeout(r, 600));

  const user = await currentUser();
  if (!user){
    invalid('Посилання діє обмежений час і лише один раз. Якщо воно застаріло — напишіть нам, надішлемо нове.');
    return;
  }

  broker = await getMyBroker();
  if (!broker){
    invalid('Для цього акаунта немає підготовленого профілю. Можливо, ви вже зареєстровані — спробуйте <a href="/vhid">увійти</a>.');
    return;
  }
  if (broker.claimed_at){ location.href = '/kabinet'; return; }

  render();
});
</script>
</body>
</html>
