<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід та Реєстрація — МитнийБрокер</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0b0e14; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .auth-card { background: #161b26; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .logo { font-size: 24px; font-weight: 700; margin-bottom: 1.5rem; text-align: center; }
  .logo span { color: #38bdf8; }
  
  .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 1.5rem; }
  .tab-btn { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: #94a3b8; transition: all 0.2s; }
  .tab-btn.active { background: #0284c7; color: #fff; }

  .role-box { margin-bottom: 1.25rem; display: none; }
  .role-title { font-size: 13px; color: #94a3b8; margin-bottom: 6px; text-align: center; }
  .role-selector { display: flex; gap: 10px; }
  .role-option { flex: 1; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #cbd5e1; transition: all 0.2s; }
  .role-option.active { border-color: #38bdf8; background: rgba(56,189,248,.1); color: #38bdf8; font-weight: 600; }

  .form-group { margin-bottom: 1.25rem; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; font-size: 14px; color: #fff; box-sizing: border-box; }
  input:focus { outline: none; border-color: #38bdf8; }
  
  .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
  .btn-submit:hover { background: #0369a1; }
  
  .error-msg { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Митний<span>Брокер</span></div>
  
  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Вхід</button>
    <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Реєстрація</button>
  </div>

  <form id="auth-form">
    <!-- Вибір ролі (видно тільки при реєстрації) -->
    <div class="role-box" id="role-group">
      <div class="role-title">Оберіть тип акаунту:</div>
      <div class="role-selector">
        <div class="role-option active" onclick="selectRole('client', this)">👤 Я Клієнт</div>
        <div class="role-option" onclick="selectRole('broker', this)">💼 Я Брокер</div>
      </div>
    </div>

    <div class="form-group">
      <label>Email адреса</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    
    <button type="submit" class="btn-submit" id="btn-submit">Увійти</button>
    <div class="error-msg" id="error-message"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ecdfpqhbaqjqurzedunh.supabase.co';
  const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGZwcWhiYXFqcXVyemVkdW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU3NTIsImV4cCI6MjA5NDg1MTc1Mn0.t0ry-slbPVwVHmF1KLzWX6EDonWBMC2Uu3KUobH8oFY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isRegisterMode = false;
  let selectedRole = 'client';

  // Автоперевірка при заході на сторінку
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) redirectByUserRole(session.user.id);
  });

  function switchMode(mode) {
    isRegisterMode = mode === 'register';
    document.getElementById('tab-login').classList.toggle('active', !isRegisterMode);
    document.getElementById('tab-register').classList.toggle('active', isRegisterMode);

    document.getElementById('role-group').style.display = isRegisterMode ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = isRegisterMode ? 'Зареєструватися' : 'Увійти';
  }

  function selectRole(role, el) {
    selectedRole = role;
    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-submit');
    const errDiv = document.getElementById('error-message');

    btn.textContent = 'Зачекайте...';
    errDiv.style.display = 'none';

    if (isRegisterMode) {
      // 1. РЕЄСТРАЦІЯ
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        showError(error.message);
      } else if (data.user) {
        // Зберігаємо роль в таблиці user_profiles
        await sb.from('user_profiles').insert([{ id: data.user.id, email: email, role: selectedRole }]);
        
        // Якщо брокер — створюємо йому запис брокера
        if (selectedRole === 'broker') {
          await sb.from('brokers').insert([{ user_id: data.user.id, name: email.split('@')[0] }]);
        }
        
        redirectByUserRole(data.user.id);
      }
    } else {
      // 2. ВХІД
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showError('Невірний email або пароль');
      } else {
        redirectByUserRole(data.user.id);
      }
    }
  });

  async function redirectByUserRole(userId) {
    const { data } = await sb.from('user_profiles').select('role').eq('id', userId).maybeSingle();
    const role = data?.role || 'client';

    if (role === 'broker') {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/client-dashboard.html';
    }
  }

  function showError(msg) {
    const errDiv = document.getElementById('error-message');
    errDiv.textContent = msg;
    errDiv.style.display = 'block';
    document.getElementById('btn-submit').textContent = isRegisterMode ? 'Зареєструватися' : 'Увійти';
  }
</script>
</body>
</html>
