<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід та Реєстрація — МитнийБрокер</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:#F5F4EF;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .auth-card{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:16px;padding:2rem;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
  .logo{font-size:22px;font-weight:700;margin-bottom:1.5rem;text-align:center}
  .logo span{color:#BA7517}
  .tabs{display:flex;gap:4px;background:#F5F4EF;padding:4px;border-radius:10px;margin-bottom:1.5rem}
  .tab-btn{flex:1;padding:8px;text-align:center;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#73726c}
  .tab-btn.active{background:#fff;color:#1a1a18;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .form-group{margin-bottom:1rem}
  label{display:block;font-size:13px;color:#73726c;margin-bottom:4px;font-weight:500}
  input, select{width:100%;padding:10px 12px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;box-sizing:border-box}
  input:focus, select:focus{outline:none;border-color:#BA7517}
  .role-selector{display:flex;gap:10px;margin-bottom:1rem}
  .role-option{flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:13px}
  .role-option.active{border-color:#BA7517;background:#FFFDF9;color:#BA7517;font-weight:600}
  .btn-submit{width:100%;padding:11px;background:#BA7517;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:5px}
  .btn-submit:hover{background:#a26412}
  .error-msg{color:#E53E3E;font-size:12px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Митний<span>Брокер</span></div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('login')">Вхід</button>
    <button class="tab-btn" onclick="switchMode('register')">Реєстрація</button>
  </div>

  <form id="auth-form">
    <div class="form-group" id="role-group" style="display:none;">
      <label>Хто ви?</label>
      <div class="role-selector">
        <div class="role-option active" onclick="selectRole('client', this)">👤 Клієнт</div>
        <div class="role-option" onclick="selectRole('broker', this)">💼 Брокер</div>
      </div>
    </div>

    <div class="form-group">
      <label>Email адреса</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    
    <button type="submit" class="btn-submit" id="btn-submit">Увійти</button>
    <div class="error-msg" id="error-message"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ecdfpqhbaqjqurzedunh.supabase.co';
  const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGZwcWhiYXFqcXVyemVkdW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU3NTIsImV4cCI6MjA5NDg1MTc1Mn0.t0ry-slbPVwVHmF1KLzWX6EDonWBMC2Uu3KUobH8oFY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isRegisterMode = false;
  let selectedRole = 'client';

  // Перевірка поточного входу та редирект за роллю
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) redirectByUserRole(session.user.id);
  });

  function switchMode(mode) {
    isRegisterMode = mode === 'register';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('role-group').style.display = isRegisterMode ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = isRegisterMode ? 'Зареєструватися' : 'Увійти';
  }

  function selectRole(role, el) {
    selectedRole = role;
    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-submit');
    const errDiv = document.getElementById('error-message');

    btn.textContent = 'Зачекайте...';
    errDiv.style.display = 'none';

    if (isRegisterMode) {
      // 1. Реєстрація
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        showError(error.message);
      } else if (data.user) {
        // Зберігаємо роль
        await sb.from('user_profiles').insert([{ id: data.user.id, email, role: selectedRole }]);
        if (selectedRole === 'broker') {
          await sb.from('brokers').insert([{ user_id: data.user.id, name: email.split('@')[0] }]);
        }
        redirectByUserRole(data.user.id);
      }
    } else {
      // 2. Вхід
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showError('Невірний email або пароль');
      } else {
        redirectByUserRole(data.user.id);
      }
    }
  });

  async function redirectByUserRole(userId) {
    const { data } = await sb.from('user_profiles').select('role').eq('id', userId).maybeSingle();
    const role = data?.role || 'client';

    if (role === 'broker') {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/client-dashboard.html';
    }
  }

  function showError(msg) {
    const errDiv = document.getElementById('error-message');
    errDiv.textContent = msg;
    errDiv.style.display = 'block';
    document.getElementById('btn-submit').textContent = isRegisterMode ? 'Зареєструватися' : 'Увійти';
  }
</script>
</body>
</html>
