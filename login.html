<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід та Реєстрація — МитнийБрокер</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .auth-card { background: #1e293b; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .logo { font-size: 24px; font-weight: 700; margin-bottom: 1.5rem; text-align: center; color: #fff; }
  .logo span { color: #38bdf8; }
  
  .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 1.5rem; }
  .tab-btn { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: #94a3b8; }
  .tab-btn.active { background: #0284c7; color: #fff; }

  .role-box { margin-bottom: 1.25rem; display: none; }
  .role-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-align: center; }
  .role-selector { display: flex; gap: 10px; }
  .role-option { flex: 1; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #cbd5e1; }
  .role-option.active { border-color: #38bdf8; background: rgba(56,189,248,.15); color: #38bdf8; font-weight: 600; }

  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
  input { width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; font-size: 14px; color: #fff; box-sizing: border-box; }
  
  .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn-submit:hover { background: #0369a1; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Митний<span>Брокер</span></div>
  
  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-login">Вхід</button>
    <button type="button" class="tab-btn" id="tab-register">Реєстрація</button>
  </div>

  <form id="auth-form">
    <div class="role-box" id="role-group">
      <div class="role-title">Оберіть роль:</div>
      <div class="role-selector">
        <div type="button" class="role-option active" id="btn-client">👤 Я Клієнт</div>
        <div type="button" class="role-option" id="btn-broker">💼 Я Брокер</div>
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-submit" id="btn-submit">Увійти</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ecdfpqhbaqjqurzedunh.supabase.co';
  const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGZwcWhiYXFqcXVyemVkdW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU3NTIsImV4cCI6MjA5NDg1MTc1Mn0.t0ry-slbPVwVHmF1KLzWX6EDonWBMC2Uu3KUobH8oFY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isRegister = false;
  let currentRole = 'client';

  // Перемикання режимів Вхід / Реєстрація
  document.getElementById('tab-login').onclick = () => setMode(false);
  document.getElementById('tab-register').onclick = () => setMode(true);

  function setMode(registerMode) {
    isRegister = registerMode;
    document.getElementById('tab-login').classList.toggle('active', !isRegister);
    document.getElementById('tab-register').classList.toggle('active', isRegister);
    document.getElementById('role-group').style.display = isRegister ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = isRegister ? 'Зареєструватися' : 'Увійти';
  }

  // Вибір ролі
  document.getElementById('btn-client').onclick = () => setRole('client');
  document.getElementById('btn-broker').onclick = () => setRole('broker');

  function setRole(role) {
    currentRole = role;
    document.getElementById('btn-client').classList.toggle('active', role === 'client');
    document.getElementById('btn-broker').classList.toggle('active', role === 'broker');
  }

  // Обробка форми
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-submit');

    btn.textContent = 'Обробка...';

    if (isRegister) {
      // 1. Реєстрація
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        alert('Помилка реєстрації: ' + error.message);
        btn.textContent = 'Зареєструватися';
      } else {
        // Зберігаємо роль в базі
        if (data.user) {
          await sb.from('user_profiles').insert([{ id: data.user.id, email: email, role: currentRole }]);
        }
        alert('Успішно зареєстровано!');
        redirect(currentRole);
      }
    } else {
      // 2. Вхід
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Помилка входу: ' + error.message);
        btn.textContent = 'Увійти';
      } else {
        // Перевіряємо роль у базі
        const { data: prof } = await sb.from('user_profiles').select('role').eq('id', data.user.id).maybeSingle();
        redirect(prof?.role || 'client');
      }
    }
  };

  function redirect(role) {
    if (role === 'broker') {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/client-dashboard.html';
    }
  }
</script>
</body>
</html>
