<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід та Реєстрація — МитнийБрокер</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0f172a; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .auth-card { background: #1e293b; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 2rem; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .logo { font-size: 24px; font-weight: 700; margin-bottom: 1.5rem; text-align: center; color: #fff; }
  .logo span { color: #38bdf8; }
  
  .tabs { display: flex; background: #0f172a; padding: 4px; border-radius: 10px; margin-bottom: 1.5rem; }
  .tab-btn { flex: 1; padding: 10px; text-align: center; border: none; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; color: #94a3b8; transition: all 0.2s; }
  .tab-btn.active { background: #0284c7; color: #fff; }

  /* Перемикач ролей */
  .role-box { margin-bottom: 1.25rem; display: none; }
  .role-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-align: center; }
  .role-selector { display: flex; gap: 10px; }
  .role-option { flex: 1; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #cbd5e1; transition: all 0.2s; }
  .role-option.active { border-color: #38bdf8; background: rgba(56,189,248,.15); color: #38bdf8; font-weight: 600; }

  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; font-size: 14px; color: #fff; box-sizing: border-box; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
  
  .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
  .btn-submit:hover { background: #0369a1; }
  
  .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Митний<span>Брокер</span></div>
  
  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Вхід</button>
    <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Реєстрація</button>
  </div>

  <form id="auth-form">
    <!-- Вибір ролі (тільки при реєстрації) -->
    <div class="role-box" id="role-group">
      <div class="role-title">Хто ви?</div>
      <div class="role-selector">
        <div class="role-option active" id="role-client" onclick="selectRole('client')">👤 Я Клієнт</div>
        <div class="role-option" id="role-broker" onclick="selectRole('broker')">💼 Я Брокер</div>
      </div>
    </div>

    <!-- Загальні поля -->
    <div class="form-group">
      <label>Email адреса</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <!-- Додаткові поля брокера (відкриваються тільки при виборі "Я Брокер") -->
    <div id="broker-fields" style="display: none;">
      <div class="form-group">
        <label>Ім'я або Назва компанії</label>
        <input type="text" id="broker-name" placeholder="ТОВ «МитБрок» або Іван Петренко">
      </div>
      <div class="form-group">
        <label>Місто</label>
        <input type="text" id="broker-city" placeholder="Київ">
      </div>
    </div>
    
    <button type="submit" class="btn-submit" id="btn-submit">Увійти</button>
    <div class="error-msg" id="error-message"></div>
  </form>
</div>
