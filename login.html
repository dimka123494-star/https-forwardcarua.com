<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід у кабінет — МитнийБрокер</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:#F5F4EF;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .login-card{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:16px;padding:2rem;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
  .logo{font-size:20px;font-weight:700;margin-bottom:1.5rem;text-align:center}
  .logo span{color:#BA7517}
  .form-group{margin-bottom:1rem}
  label{display:block;font-size:13px;color:#73726c;margin-bottom:4px;font-weight:500}
  input{width:100%;padding:10px 12px;border:1px solid #E2E8F0;border-radius:8px;font-size:14px;box-sizing:border-box}
  input:focus{outline:none;border-color:#BA7517}
  .btn-submit{width:100%;padding:11px;background:#BA7517;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
  .btn-submit:hover{background:#a26412}
  .error-msg{color:#E53E3E;font-size:12px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">Митний<span>Брокер</span></div>
  <h2 style="font-size:18px;margin-bottom:1.25rem;text-align:center;">Вхід у кабінет</h2>
  
  <form id="login-form">
    <div class="form-group">
      <label>Email адреса</label>
      <input type="email" id="email" required placeholder="broker@example.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-submit" id="btn-login">Увійти</button>
    <div class="error-msg" id="error-message"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://ecdfpqhbaqjqurzedunh.supabase.co';
  const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGZwcWhiYXFqcXVyemVkdW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU3NTIsImV4cCI6MjA5NDg1MTc1Mn0.t0ry-slbPVwVHmF1KLzWX6EDonWBMC2Uu3KUobH8oFY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Перевірка: якщо вже залогінений — в кабінет
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/cabinet/dashboard.html';
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    const errDiv = document.getElementById('error-message');

    btn.textContent = 'Вхід...';
    errDiv.style.display = 'none';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errDiv.textContent = 'Невірний email або пароль';
      errDiv.style.display = 'block';
      btn.textContent = 'Увійти';
    } else {
      window.location.href = '/cabinet/dashboard.html';
    }
  });
</script>
</body>
</html>
