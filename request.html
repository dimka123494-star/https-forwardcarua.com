<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Залишити заявку митному брокеру | МитнийБрокер</title>
<meta name="description" content="Опишіть завдання — розмитнення авто, оцінка, договір купівлі-продажу — і отримайте відповідь від митного брокера.">
<link rel="canonical" href="https://forwardcarua.com/zayavka">

<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18171698074"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date()); gtag('config', 'AW-18171698074');
</script>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
.wiz{max-width:680px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.prog{display:flex;align-items:center;margin-bottom:.5rem}
.pnum{width:30px;height:30px;border-radius:50%;border:.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);flex-shrink:0;transition:all .2s}
.pnum.active{background:var(--blue);border-color:var(--blue);color:#fff}
.pnum.done{background:rgba(45,217,143,.15);border-color:var(--green);color:var(--green)}
.pline{flex:1;height:.5px;background:var(--border)}
.pline.done{background:var(--green)}
.plabels{display:flex;justify-content:space-between;margin-bottom:1.75rem}
.plabel{font-size:11px;color:var(--muted)}
.plabel.active{color:var(--blue);font-weight:500}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.svc-card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px 12px;
  cursor:pointer;text-align:center;transition:all .15s}
.svc-card:hover{border-color:var(--border-strong)}
.svc-card.on{background:var(--blue-glow);border-color:var(--blue)}
.svc-ico{font-size:24px;margin-bottom:6px}
.svc-n{font-size:13px;font-weight:500}
.svc-d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.urg{display:flex;gap:8px;flex-wrap:wrap}
.bcard{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;
  cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:all .15s}
.bcard.on{background:var(--blue-glow);border-color:var(--blue)}
.sum{background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px}
.sum-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:.5px solid var(--border)}
.sum-row:last-child{border:none}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:1.25rem;flex-wrap:wrap}
.done-icon{width:64px;height:64px;border-radius:50%;background:rgba(45,217,143,.15);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 1rem}
.next-list{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:1.5rem auto;text-align:left}
.next-item{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.next-n{width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--blue);font-size:12px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/">Митний<span>Брокер</span></a>
  <div class="nav-links"><a class="nav-link" href="/">Каталог</a></div>
  <div class="nav-actions"><a class="btn btn-ghost btn-sm" href="/">← Каталог</a></div>
</nav>

<div class="page">
  <div class="wiz" id="wiz"></div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/db.js"></script>
<script>
let step = 1;
let data = { service:null, urgency:null, car:{}, contact:{}, brokerId:null };
let topBrokers = [], targetBroker = null;

const LABELS = ['Послуга','Деталі','Брокер','Контакти'];

function progress(){
  let bars = '';
  for (let i = 1; i <= 4; i++){
    const cls = i < step ? 'done' : i === step ? 'active' : '';
    bars += '<div style="display:flex;align-items:center;flex:1">' +
            '<div class="pnum ' + cls + '">' + (i < step ? '✓' : i) + '</div>' +
            (i < 4 ? '<div class="pline ' + (i < step ? 'done' : '') + '"></div>' : '') + '</div>';
  }
  return '<div class="prog">' + bars + '</div><div class="plabels">' +
    LABELS.map((l,i) => '<span class="plabel ' + (i+1 === step ? 'active' : '') + '">' + l + '</span>').join('') +
    '</div>';
}

function render(){
  const el = document.getElementById('wiz');

  if (step === 1){
    el.innerHTML = progress() +
      '<div class="card"><h1 class="h-sm" style="margin-bottom:4px">Яка послуга потрібна?</h1>' +
      '<p class="text-sm text-muted" style="margin-bottom:1.25rem">Оберіть напрямок — далі уточнимо деталі</p>' +
      '<div class="svc-grid">' + SERVICES.map(s =>
        '<div class="svc-card ' + (data.service === s.name ? 'on' : '') + '" onclick="pickService(\'' + s.name + '\')">' +
        '<div class="svc-ico">' + s.icon + '</div><div class="svc-n">' + s.name + '</div>' +
        '<div class="svc-d">' + s.desc + '</div></div>').join('') + '</div>' +
      '<div class="msg" id="e1"></div></div>' +
      '<div class="actions"><span></span><button class="btn btn-primary" onclick="next1()">Далі</button></div>';
  }

  else if (step === 2){
    const isAuto = ['Розмитнення авто','Авто зі США','Оцінка авто'].includes(data.service);
    el.innerHTML = progress() +
      '<div class="card"><h2 class="h-sm" style="margin-bottom:4px">Деталі запиту</h2>' +
      '<p class="text-sm text-muted" style="margin-bottom:1.25rem">Чим конкретніше — тим точніша відповідь брокера</p>' +
      (isAuto
        ? '<div class="field-row">' +
            '<div class="field"><label class="label" for="c-make">Марка</label><input class="input" id="c-make" value="' + esc(data.car.make || '') + '" placeholder="Toyota, BMW…"></div>' +
            '<div class="field"><label class="label" for="c-model">Модель</label><input class="input" id="c-model" value="' + esc(data.car.model || '') + '" placeholder="Camry"></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div class="field"><label class="label" for="c-year">Рік</label><input class="input" id="c-year" value="' + esc(data.car.year || '') + '" placeholder="2019" inputmode="numeric"></div>' +
            '<div class="field"><label class="label" for="c-country">Країна</label><select class="input" id="c-country">' +
              '<option value="">Оберіть…</option>' +
              ['США','Німеччина','Польща','Литва','ОАЕ','Японія','Корея','Інша'].map(c =>
                '<option ' + (data.car.country === c ? 'selected' : '') + '>' + c + '</option>').join('') +
            '</select></div>' +
          '</div>'
        : '') +
      '<div class="field"><label class="label" for="c-comment">Опис завдання</label>' +
        '<textarea class="input" id="c-comment" placeholder="Що саме потрібно, у які терміни, чи є документи…">' + esc(data.comment || '') + '</textarea></div>' +
      '<div class="field"><span class="label">Терміновість</span><div class="urg">' +
        URGENCIES.map(u => '<button class="chip ' + (data.urgency === u ? 'active' : '') + '" onclick="pickUrgency(this,\'' + u + '\')">' + u + '</button>').join('') +
      '</div></div></div>' +
      '<div class="actions"><button class="btn btn-ghost" onclick="goStep(1)">← Назад</button>' +
      '<button class="btn btn-primary" onclick="next2()">Далі</button></div>';
  }

  else if (step === 3){
    el.innerHTML = progress() +
      '<div class="card"><h2 class="h-sm" style="margin-bottom:4px">Кому надіслати заявку?</h2>' +
      '<p class="text-sm text-muted" style="margin-bottom:1.25rem">Оберіть конкретного брокера або надішліть загальну заявку</p>' +
      '<div class="bcard ' + (!data.brokerId ? 'on' : '') + '" onclick="pickBroker(null)">' +
        '<div class="avatar avatar-sm" style="background:var(--surface2);color:var(--muted)"><i class="ti ti-users"></i></div>' +
        '<div><div style="font-size:14px;font-weight:500">Будь-який вільний брокер</div>' +
        '<div class="text-xs text-muted">Заявку побачить наш менеджер і передасть профільному брокеру</div></div>' +
      '</div>' +
      (topBrokers.length
        ? topBrokers.map(b =>
            '<div class="bcard ' + (data.brokerId === b.id ? 'on' : '') + '" onclick="pickBroker(\'' + b.id + '\')">' +
            '<div class="avatar avatar-sm av-' + esc(b.plan || 'free') + '">' + esc(initials(b.name)) + '</div>' +
            '<div style="flex:1"><div style="font-size:14px;font-weight:500">' + esc(b.name) + '</div>' +
            '<div class="text-xs text-muted">' + esc([b.city, b.region].filter(Boolean).join(', ')) +
            (b.rating_avg ? ' · ★ ' + Number(b.rating_avg).toFixed(1) : '') + '</div></div></div>').join('')
        : '<p class="text-sm text-muted" style="margin-top:10px">Брокерів у каталозі поки немає — заявка піде менеджеру.</p>') +
      '</div>' +
      '<div class="actions"><button class="btn btn-ghost" onclick="goStep(2)">← Назад</button>' +
      '<button class="btn btn-primary" onclick="goStep(4)">Далі</button></div>';
  }

  else if (step === 4){
    el.innerHTML = progress() +
      '<div class="card" style="margin-bottom:12px"><h2 class="h-sm" style="margin-bottom:1.25rem">Ваші контакти</h2>' +
      '<div class="field-row">' +
        '<div class="field"><label class="label" for="k-name">Ім\'я *</label><input class="input" id="k-name" value="' + esc(data.contact.name || '') + '" placeholder="Андрій" autocomplete="name"></div>' +
        '<div class="field"><label class="label" for="k-phone">Телефон *</label><input class="input" id="k-phone" type="tel" inputmode="tel" value="' + esc(data.contact.phone || '') + '" placeholder="+380 50 123 45 67" autocomplete="tel"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label class="label" for="k-tg">Telegram</label><input class="input" id="k-tg" value="' + esc(data.contact.telegram || '') + '" placeholder="@username"></div>' +
        '<div class="field"><label class="label" for="k-email">Email</label><input class="input" id="k-email" type="email" value="' + esc(data.contact.email || '') + '" placeholder="you@email.com" autocomplete="email"></div>' +
      '</div>' +
      '<div class="msg" id="e4"></div></div>' +

      '<div class="card" style="margin-bottom:12px"><div class="card-title">Підсумок</div><div class="sum">' +
        '<div class="sum-row"><span class="text-muted">Послуга</span><span>' + esc(data.service || '—') + '</span></div>' +
        (data.car.make ? '<div class="sum-row"><span class="text-muted">Авто</span><span>' +
          esc([data.car.make, data.car.model, data.car.year].filter(Boolean).join(' ')) + '</span></div>' : '') +
        (data.car.country ? '<div class="sum-row"><span class="text-muted">Країна</span><span>' + esc(data.car.country) + '</span></div>' : '') +
        (data.urgency ? '<div class="sum-row"><span class="text-muted">Терміновість</span><span>' + esc(data.urgency) + '</span></div>' : '') +
        '<div class="sum-row"><span class="text-muted">Брокер</span><span>' +
          esc(data.brokerId ? (topBrokers.find(b => b.id === data.brokerId)?.name || 'Обраний брокер') : 'Будь-який вільний') + '</span></div>' +
      '</div>' +
      '<p class="hint">Надсилаючи заявку, ви передаєте контакти обраному брокеру та погоджуєтесь з ' +
      '<a href="/terms#privacy" target="_blank" rel="noopener">політикою конфіденційності</a>.</p></div>' +

      '<div class="actions"><button class="btn btn-ghost" onclick="goStep(3)">← Назад</button>' +
      '<button class="btn btn-primary" id="sendBtn" onclick="send()"><i class="ti ti-send"></i> Надіслати заявку</button></div>';
  }

  else {
    el.innerHTML =
      '<div class="card" style="text-align:center;padding:2.5rem 1.5rem">' +
      '<div class="done-icon"><i class="ti ti-check"></i></div>' +
      '<h1 class="h-sm" style="font-size:22px;margin-bottom:8px">Заявку надіслано</h1>' +
      '<p class="text-sm text-muted">Брокер зв\'яжеться з вами найближчим часом за вказаним номером.</p>' +
      '<div class="next-list">' +
        '<div class="next-item"><span class="next-n">1</span>Брокер вивчить деталі запиту</div>' +
        '<div class="next-item"><span class="next-n">2</span>Зателефонує або напише в Telegram</div>' +
        '<div class="next-item"><span class="next-n">3</span>Узгодить ціну і терміни</div>' +
      '</div>' +
      '<div class="row" style="justify-content:center;margin-top:1rem">' +
        '<a class="btn btn-ghost" href="/">До каталогу</a>' +
        '<a class="btn btn-primary" href="/moi-zayavky">Мої заявки</a>' +
      '</div>' +
      '<p class="hint" style="margin-top:1rem">Щоб бачити статус заявки в кабінеті, зареєструйтесь — це безкоштовно.</p>' +
      '</div>';
  }
  window.scrollTo(0,0);
}

function goStep(n){ step = n; render(); }
function pickService(name){ data.service = name; render(); }
function pickUrgency(el, u){
  data.urgency = u;
  document.querySelectorAll('.urg .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
function pickBroker(id){ data.brokerId = id; render(); }

function next1(){
  if (!data.service){
    const e = document.getElementById('e1');
    e.className = 'msg show msg-err'; e.textContent = 'Оберіть послугу';
    return;
  }
  goStep(2);
}
function next2(){
  const v = id => document.getElementById(id)?.value.trim() || '';
  data.car = { make:v('c-make'), model:v('c-model'), year:v('c-year'), country:v('c-country') };
  data.comment = v('c-comment');
  goStep(3);
}

async function send(){
  const v = id => document.getElementById(id).value.trim();
  data.contact = { name:v('k-name'), phone:v('k-phone'), telegram:v('k-tg'), email:v('k-email') };
  const e = document.getElementById('e4');
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Надсилаємо…';
  try{
    await createRequest({
      brokerId: data.brokerId,
      service: data.service,
      comment: data.comment,
      urgency: data.urgency,
      car: data.car,
      contact: data.contact
    });
    step = 5; render();
  }catch(err){
    e.className = 'msg show msg-err'; e.textContent = err.message;
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-send"></i> Надіслати заявку';
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(location.search);
  const preselect = params.get('broker');
  const svc = params.get('service');
  if (svc && SERVICE_NAMES.includes(svc)) data.service = svc;

  render();

  try{
    topBrokers = (await listBrokers({ sort:'plan' })).slice(0, 8);
    if (preselect){
      targetBroker = await getBroker(preselect);
      if (targetBroker){
        data.brokerId = targetBroker.id;
        if (!topBrokers.some(b => b.id === targetBroker.id)) topBrokers.unshift(targetBroker);
      }
    }
  }catch(e){ /* каталог недоступний — заявка все одно пройде як загальна */ }

  // Підставляємо контакти, якщо людина вже увійшла
  const profile = await getMyProfile();
  if (profile){
    data.contact.name  = profile.full_name || '';
    data.contact.phone = profile.phone || '';
  }
  if (step === 1) render();
});
</script>
</body>
</html>
