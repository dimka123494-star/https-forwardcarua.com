<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабінет клієнта — МитнийБрокер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: #0b0e14; color: #fff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
  .container { max-width: 650px; margin: 0 auto; }
  
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .nav-back { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: 500; }
  
  .header-card { background: #161b26; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .user-name { font-size: 18px; font-weight: bold; margin: 0; color: #fff; }
  .user-info { color: #38bdf8; font-size: 13px; margin-top: 4px; }
  
  .btn-logout { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: #f87171; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  
  .card { background: #161b26; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
  
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, textarea { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,.15); background: #0f172a; border-radius: 8px; font-size: 14px; color: #fff; box-sizing: border-box; }
  
  .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-submit:hover { background: #0369a1; }
  
  .request-item { background: #0f172a; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 1rem; margin-bottom: 12px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(56,189,248,.15); color: #38bdf8; }
  .empty-state { text-align: center; color: #64748b; padding: 2rem 0; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <div class="nav-header">
    <a href="/catalog.html" class="nav-back">← Каталог брокерів</a>
  </div>

  <div class="header-card">
    <div>
      <h2 class="user-name" id="user-display-name">Завантаження...</h2>
      <div class="user-info" id="user-display-phone"></div>
    </div>
    <button class="btn-logout" onclick="logout()">Вийти</button>
  </div>

  <!-- Форма створення заявки -->
  <div class="card">
    <div class="card-title">📝 Створити загальну заявку на розмитнення</div>
    <form id="new-request-form">
      <div class="form-group">
        <label>Опис авто або вантажу</label>
        <textarea id="req-desc" rows="3" required placeholder="Наприклад: VW Passat 2017 р.в. з Німеччини, потрібне повне розмитнення"></textarea>
      </div>
      <button type="submit" class="btn-submit" id="btn-submit">Опублікувати заявку</button>
    </form>
  </div>

  <!-- Список заявок -->
  <div class="card">
    <div class="card-title">📋 Мої опубліковані заявки</div>
    <div id="requests-list">
      <div class="empty-state">Завантаження заявок...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ecdfpqhbaqjqurzedunh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjZGZwcWhiYXFqcXVyemVkdW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzU3NTIsImV4cCI6MjA5NDg1MTc1Mn0.t0ry-slbPVwVHmF1KLzWX6EDonWBMC2Uu3KUobH8oFY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return;
    }
    currentUser = session.user;
    
    const userName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    const userPhone = currentUser.user_metadata?.phone || 'Телефон не вказано';

    document.getElementById('user-display-name').textContent = userName;
    document.getElementById('user-display-phone').textContent = '📞 ' + userPhone + ' | ✉️ ' + currentUser.email;

    loadUserRequests();
  }

  async function loadUserRequests() {
    const listDiv = document.getElementById('requests-list');
    
    const { data: requests, error } = await sb
      .from('requests')
      .select('*')
      .eq('client_email', currentUser.email)
      .order('id', { ascending: false });

    if (error || !requests || requests.length === 0) {
      listDiv.innerHTML = '<div class="empty-state">У вас ще немає створених заявок</div>';
      return;
    }

    listDiv.innerHTML = requests.map(r => `
      <div class="request-item">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 6px;">
          <div style="font-weight: 600; font-size: 15px;">${r.message || 'Запит на розмитнення'}</div>
          <span class="badge">${r.status === 'new' ? 'Нова' : r.status}</span>
        </div>
        <div style="font-size: 12px; color: #94a3b8;">
          ${r.broker_name ? '👨‍💼 Кому: ' + r.broker_name : '🌐 Загальна заявка в каталог'}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('new-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const desc = document.getElementById('req-desc').value;
    const btn = document.getElementById('btn-submit');

    btn.textContent = 'Збереження...';

    const userName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
    const userPhone = currentUser.user_metadata?.phone || '';

    const { error } = await sb.from('requests').insert([{
      client_email: currentUser.email,
      client_name: userName,
      client_phone: userPhone,
      message: desc,
      status: 'new'
    }]);

    if (error) {
      alert('Помилка: ' + error.message);
    } else {
      document.getElementById('req-desc').value = '';
      alert('Заявку успішно створено!');
      loadUserRequests();
    }
    btn.textContent = 'Опублікувати заявку';
  });

  async function logout() {
    await sb.auth.signOut();
    window.location.href = '/login.html';
  }

  init();
</script>
</body>
</html>
