<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMR — МитнийБрокер</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#111; --line:#222; --muted:#555; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9ebee; color: var(--ink); font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #0f1a14; color: #fff; }
  .bar b { font-size: 15px; margin-right: auto; }
  .bar button, .bar a { font: 600 14px Arial, sans-serif; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; text-decoration: none; }
  .bar .p { background: #10b981; color: #04150d; }
  .bar .g { background: rgba(255,255,255,.12); color: #fff; }
  .bar label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .note { max-width: 210mm; margin: 12px auto 0; padding: 0 16px; font-size: 13px; color: #333; line-height: 1.45; }
  #msg { max-width: 210mm; margin: 40px auto; padding: 0 16px; font-size: 15px; }
  .sheets { padding: 12px 0 40px; }
  .page { width: 210mm; min-height: 297mm; margin: 12px auto; background: #fff; padding: 8mm 8mm 7mm; box-shadow: 0 2px 12px rgba(0,0,0,.15); position: relative; }
  .copy { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2mm; }
  .copy .n { font-size: 9pt; font-weight: 700; padding: 1mm 3mm; border: 1.4px solid var(--c); color: var(--c); border-radius: 2px; }
  .copy .t { font-size: 15pt; font-weight: 800; letter-spacing: 2px; }
  .copy .t small { font-size: 7pt; letter-spacing: 0; font-weight: 400; display: block; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; border: 1.4px solid var(--c); }
  .b { border-right: .8px solid var(--c); border-bottom: .8px solid var(--c); padding: 1.2mm 1.8mm 1.5mm; min-height: 15mm; position: relative; overflow: hidden; }
  .b.r { border-right: 0; }
  .b .no { position: absolute; left: 1mm; top: .8mm; font-size: 8pt; font-weight: 800; color: var(--c); }
  .b .lb { margin-left: 4.5mm; font-size: 5.6pt; line-height: 1.2; color: var(--muted); }
  .b .v { font-size: 9pt; line-height: 1.3; margin-top: 1mm; white-space: pre-line; word-break: break-word; }
  .b .v.big { font-size: 10pt; font-weight: 700; }
  .full { grid-column: 1 / -1; border-right: 0; }
  .goods { grid-column: 1 / -1; border-right: 0; padding: 0; min-height: 52mm; }
  .goods table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .goods th { font-size: 5.6pt; font-weight: 400; color: var(--muted); text-align: left; vertical-align: top; padding: 1mm 1.5mm; border-right: .8px solid var(--c); border-bottom: .8px solid var(--c); line-height: 1.2; }
  .goods th b { color: var(--c); font-size: 8pt; display: block; }
  .goods td { font-size: 9pt; padding: 1.4mm 1.5mm; border-right: .8px solid var(--c); vertical-align: top; word-break: break-word; }
  .goods th:last-child, .goods td:last-child { border-right: 0; }
  .goods tr.sum td { border-top: .8px solid var(--c); font-weight: 700; }
  .pay table { width: 100%; border-collapse: collapse; font-size: 6pt; margin-top: 1mm; }
  .pay td, .pay th { border: .6px solid #999; padding: .6mm 1mm; font-weight: 400; text-align: left; }
  .chk { display: inline-block; width: 3mm; height: 3mm; border: .8px solid var(--ink); margin-right: 1mm; vertical-align: -.5mm; text-align: center; line-height: 2.6mm; font-size: 8pt; font-weight: 700; }
  .sig { min-height: 26mm; }
  .sig3 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-column: 1 / -1; }
  .sig3 .b:last-child { border-right: 0; }
  .sig3 .b { border-bottom: 0; }
  .foot { font-size: 6pt; color: var(--muted); margin-top: 1.5mm; display: flex; justify-content: space-between; }
  @media print {
    @page { size: A4; margin: 0; }
    html, body { background: #fff; }
    .bar, .note { display: none !important; }
    .sheets { padding: 0; }
    .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; width: 210mm; height: 297mm; min-height: 0; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media screen and (max-width: 820px) {
    .sheets { overflow-x: auto; }
    .page { transform-origin: top left; }
  }
</style>
</head>
<body>
<div class="bar"><b>CMR</b>
  <label><input type="checkbox" id="mono" onchange="render()"> Чорно-біла</label>
  <select id="copies" onchange="render()" style="font:14px Arial;padding:7px;border-radius:8px">
    <option value="3">3 примірники</option><option value="4">4 примірники</option><option value="1">1 примірник</option>
  </select>
  <button class="p" onclick="window.print()">🖨 Друкувати / PDF</button>
  <a class="g" href="/kabinet#rmpd">← Кабінет</a>
</div>
<p class="note" id="note" hidden>Щоб зберегти PDF на iPhone: «Друкувати / PDF» → у вікні друку «Поділитися» → «Зберегти у Файли». Підписи й печатки ставлять сторони на паперовому примірнику.</p>
<div id="msg">Завантаження…</div>
<div class="sheets" id="sheets"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/db.js"></script>
<script>
const COPIES = [
  { n: 1, c: '#c62828', ua: 'Примірник для відправника', pl: 'Egzemplarz dla nadawcy', en: 'Copy for sender' },
  { n: 2, c: '#1565c0', ua: 'Примірник для одержувача', pl: 'Egzemplarz dla odbiorcy', en: 'Copy for consignee' },
  { n: 3, c: '#2e7d32', ua: 'Примірник для перевізника', pl: 'Egzemplarz dla przewoźnika', en: 'Copy for carrier' },
  { n: 4, c: '#444444', ua: 'Додатковий примірник', pl: 'Egzemplarz dodatkowy', en: 'Additional copy' }
];
const L = {
  1: ['Відправник (найменування, адреса, країна)', 'Nadawca (nazwisko lub nazwa, adres, kraj)', 'Sender (name, address, country)'],
  2: ['Одержувач (найменування, адреса, країна)', 'Odbiorca (nazwisko lub nazwa, adres, kraj)', 'Consignee (name, address, country)'],
  3: ['Місце розвантаження (місто, країна)', 'Miejsce przeznaczenia (miejscowość, kraj)', 'Place of delivery of the goods (place, country)'],
  4: ['Місце й дата завантаження (місто, країна, дата)', 'Miejsce i data załadowania (miejscowość, kraj, data)', 'Place and date of taking over the goods (place, country, date)'],
  5: ['Додані документи', 'Załączone dokumenty', 'Documents attached'],
  6: ['Знаки й номери', 'Cechy i numery', 'Marks and Nos'],
  7: ['Кількість місць', 'Ilość sztuk', 'Number of packages'],
  8: ['Рід упаковки', 'Sposób opakowania', 'Method of packing'],
  9: ['Найменування вантажу', 'Rodzaj towaru', 'Nature of the goods'],
  10: ['Статистичний номер', 'Numer statystyczny', 'Statistical number'],
  11: ['Вага брутто, кг', 'Waga brutto w kg', 'Gross weight in kg'],
  12: ['Обʼєм, м³', 'Objętość w m³', 'Volume in m³'],
  13: ['Вказівки відправника (митна та інша обробка)', 'Instrukcje nadawcy (formalności celne i inne)', "Sender's instructions (customs and other formalities)"],
  14: ['Вказівки щодо оплати перевезення', 'Postanowienia odnośnie przewoźnego', 'Instructions as to payment for carriage'],
  15: ['Накладений платіж', 'Zapłata / Pobranie', 'Cash on delivery'],
  16: ['Перевізник (найменування, адреса, країна)', 'Przewoźnik (nazwisko lub nazwa, adres, kraj)', 'Carrier (name, address, country)'],
  17: ['Наступні перевізники', 'Kolejni przewoźnicy', 'Successive carriers'],
  18: ['Застереження й зауваження перевізника', 'Zastrzeżenia i uwagi przewoźnika', "Carrier's reservations and observations"],
  19: ['Особливі умови', 'Postanowienia specjalne', 'Special agreements'],
  20: ['Підлягає оплаті', 'Do zapłacenia', 'To be paid by'],
  21: ['Складено в … дата', 'Wystawiono w … dnia', 'Established in … on'],
  22: ['Підпис і печатка відправника', 'Podpis i stempel nadawcy', 'Signature and stamp of the sender'],
  23: ['Підпис і печатка перевізника', 'Podpis i stempel przewoźnika', 'Signature and stamp of the carrier'],
  24: ['Вантаж отримано: місце, дата, підпис і печатка одержувача', 'Przesyłkę otrzymano: miejscowość, data, podpis i stempel odbiorcy', 'Goods received: place, date, signature and stamp of the consignee']
};
let doc = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const dmy = d => d && /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : (d || '');
const lb = n => '<span class="no">' + n + '</span><div class="lb">' + L[n].join(' · ') + '</div>';
const box = (n, v, cls = '', vcls = '') => '<div class="b ' + cls + '">' + lb(n) + '<div class="v ' + vcls + '">' + v + '</div></div>';
const party = p => p ? '<b>' + esc(p.name) + '</b>' + (p.address ? '\n' + esc(p.address) : '') : '';
const num = s => { const x = parseFloat(String(s || '').replace(',', '.').replace(/\s/g, '')); return isFinite(x) ? x : 0; };

function page(cp){
  const d = doc.data || {}, g = (d.goods || []).filter(x => Object.values(x).some(Boolean));
  const tw = g.reduce((a, x) => a + num(x.gross), 0), tv = g.reduce((a, x) => a + num(x.volume), 0), tp = g.reduce((a, x) => a + num(x.packages), 0);
  const rows = g.map(x => '<tr><td>' + esc(x.marks) + '</td><td>' + esc(x.packages) + '</td><td>' + esc(x.packing) + '</td><td>' + esc(x.nature) + '</td><td>' + esc(x.stat) + '</td><td>' + esc(x.gross) + '</td><td>' + esc(x.volume) + '</td></tr>').join('');
  const fmt = n => n ? n.toLocaleString('uk-UA', { maximumFractionDigits: 3 }) : '';
  const sum = g.length > 1 ? '<tr class="sum"><td>Разом / Razem</td><td>' + fmt(tp) + '</td><td></td><td></td><td></td><td>' + fmt(tw) + '</td><td>' + fmt(tv) + '</td></tr>' : '';
  const veh = [d.plate && 'Тягач / Ciągnik: ' + esc(d.plate), d.trailer && 'Причіп / Naczepa: ' + esc(d.trailer)].filter(Boolean).join('\n');
  const pay = d.payment === 'unfrei' ? 'unfrei' : 'frei';
  const color = document.getElementById('mono').checked ? '#222' : cp.c;
  return '<div class="page" style="--c:' + color + '">' +
    '<div class="copy"><span class="n">' + cp.n + ' · ' + cp.ua + ' · ' + cp.pl + ' · ' + cp.en + '</span>' +
      '<div class="t" style="text-align:right">CMR' + (doc.number ? ' № ' + esc(doc.number) : '') + '<small>Міжнародна товарно-транспортна накладна · Międzynarodowy samochodowy list przewozowy · International consignment note</small></div></div>' +
    '<div class="grid">' +
      box(1, party(d.sender), '', '') +
      '<div class="b r" style="font-size:6.5pt;color:var(--muted);line-height:1.35">Це перевезення, незважаючи на будь-які інші умови, регулюється Конвенцією про договір міжнародного дорожнього перевезення вантажів (КДПВ / CMR).<br>Ten przewóz podlega, niezależnie od wszelkich przeciwnych klauzul, postanowieniom Konwencji o umowie międzynarodowego przewozu drogowego towarów (CMR).<br>This carriage is subject, notwithstanding any clause to the contrary, to the Convention on the Contract for the International Carriage of Goods by Road (CMR).</div>' +
      box(2, party(d.consignee)) + box(16, party(d.carrier) + (veh ? '\n' + veh : ''), 'r') +
      box(3, esc(d.delivery_place)) + box(17, esc(d.successive), 'r') +
      box(4, esc(d.taking_place) + (d.taking_date ? '\n' + dmy(d.taking_date) : '')) + box(18, esc(d.reservations), 'r') +
      box(5, esc(d.docs), 'full') +
      '<div class="b goods"><table><colgroup><col style="width:13%"><col style="width:9%"><col style="width:13%"><col style="width:31%"><col style="width:11%"><col style="width:12%"><col style="width:11%"></colgroup>' +
        '<tr>' + [6, 7, 8, 9, 10, 11, 12].map(n => '<th><b>' + n + '</b>' + L[n].join(' · ') + '</th>').join('') + '</tr>' + rows + sum + '</table></div>' +
      box(13, esc(d.instructions)) + box(19, esc(d.special), 'r') +
      '<div class="b">' + lb(14) + '<div class="v"><span class="chk">' + (pay === 'frei' ? '✕' : '') + '</span>Frei — сплачує відправник / opłaca nadawca / carriage paid<br><span class="chk">' + (pay === 'unfrei' ? '✕' : '') + '</span>Unfrei — сплачує одержувач / opłaca odbiorca / carriage forward</div></div>' +
      '<div class="b r pay">' + lb(20) + '<table><tr><th></th><th>Відправник<br>Nadawca / Sender</th><th>Валюта<br>Waluta</th><th>Одержувач<br>Odbiorca / Consignee</th></tr>' +
        ['Провізна плата / Przewoźne / Carriage charges', 'Знижки / Bonifikaty / Deductions', 'Різниця / Saldo / Balance', 'Надбавки / Dopłaty / Supplements', 'Додаткові збори / Opłaty dodatkowe / Other charges', 'Разом / Razem / Total'].map(t => '<tr><td>' + t + '</td><td></td><td></td><td></td></tr>').join('') + '</table></div>' +
      box(21, esc(d.issue_place) + (d.issue_date ? '  ·  ' + dmy(d.issue_date) : '')) + box(15, esc(d.cod), 'r') +
      '<div class="sig3">' + box(22, '', 'sig') + box(23, '', 'sig') + box(24, '', 'sig') + '</div>' +
    '</div>' +
    '<div class="foot"><span>Сформовано на forwardcarua.com · МитнийБрокер</span><span>' + (doc.is_test ? 'ТЕСТОВИЙ ДОКУМЕНТ · ' : '') + 'ID ' + esc(String(doc.id).slice(0, 8)) + '</span></div>' +
  '</div>';
}
function render(){
  if (!doc) return;
  const n = Number(document.getElementById('copies').value) || 3;
  document.getElementById('sheets').innerHTML = COPIES.slice(0, n).map(page).join('');
  fit();
}
function fit(){
  const w = window.innerWidth, pw = 210 * 3.7795 + 24;
  document.querySelectorAll('.page').forEach(p => {
    if (w < pw){ const k = (w - 16) / (210 * 3.7795); p.style.transform = 'scale(' + k + ')'; p.style.marginBottom = (-(1 - k) * 297 * 3.7795 + 12) + 'px'; p.style.marginLeft = '8px'; }
    else { p.style.transform = ''; p.style.marginBottom = ''; p.style.marginLeft = ''; }
  });
}
window.addEventListener('resize', fit);
window.addEventListener('beforeprint', () => document.querySelectorAll('.page').forEach(p => { p.style.transform = ''; p.style.marginBottom = ''; p.style.marginLeft = ''; }));
window.addEventListener('afterprint', fit);

(async () => {
  const msg = document.getElementById('msg');
  const id = new URLSearchParams(location.search).get('id');
  if (!id){ msg.textContent = 'Не вказано документ. Створіть CMR у кабінеті з картки рейсу.'; return; }
  const user = await currentUser();
  if (!user){ location.href = '/vhid?next=' + encodeURIComponent('/cmr?id=' + id); return; }
  doc = await getCmr(id);
  if (!doc){ msg.textContent = 'CMR не знайдено або вона належить іншому акаунту.'; return; }
  msg.remove(); document.getElementById('note').hidden = false;
  document.title = 'CMR ' + (doc.number || (doc.data && doc.data.plate) || '') + ' — МитнийБрокер';
  render();
})();
</script>
</body>
</html>
