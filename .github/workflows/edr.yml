name: ЄДР — дані перевізників і всіх компаній
on:
  schedule:
    - cron: '17 3 * * 3'   # щосереди 03:17 UTC (набір на data.gov.ua оновлюється щотижня)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/edr_import.py', 'tools/edr_shards.py', 'tools/edrx_public.pem', '.github/workflows/edr.yml']
permissions:
  contents: write
concurrency: edr
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Усі юрособи → шарди в релізі edr-data (картка /c/{ЄДРПОУ}, звіт «Перевірка компанії»).
      # Збій цього кроку не зупиняє оновлення даних перевізників нижче.
      - name: ЄДР усіх компаній — шарди
        id: shards
        continue-on-error: true
        run: |
          python3 -c "import cryptography" 2>/dev/null || pip install -q cryptography
          python3 tools/edr_shards.py uo.zip
      - name: ЄДР усіх компаній — публікація в реліз edr-data
        if: steps.shards.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view edr-data >/dev/null 2>&1 || gh release create edr-data --latest=false \
            --title "Відкриті дані ЄДР (шарди)" --notes "Службовий реліз: оновлюється щотижня workflow edr.yml. Не видаляти."
          # спершу шарди, мета — останньою: поки вона стара, читачі знають, що оновлення ще йде
          # у релізі може бути не більше 1000 файлів: зашифровані edrx-* живуть в окремому релізі edrx-data
          for a in $(gh release view edr-data --json assets -q '.assets[].name' | grep '^edrx-' || true); do gh release delete-asset edr-data "$a" -y; done
          gh release upload edr-data out-edr/edr-*.json.gz --clobber
          if ls out-edr/edrx-*.bin >/dev/null 2>&1; then
            gh release view edrx-data >/dev/null 2>&1 || gh release create edrx-data --latest=false \
              --title "ЄДР: розширені дані (зашифровано)" --notes "Службовий реліз: зашифровані дані для витягу з ЄДР (workflow edr.yml). Не видаляти."
            gh release upload edrx-data out-edr/edrx-*.bin --clobber
          fi
          gh release upload edr-data out-edr/edr-meta.json --clobber
      - name: Import (перевізники)
        run: UO_ZIP=uo.zip python3 tools/edr_import.py
      - name: Commit
        run: |
          git config user.name "edr-bot"
          git config user.email "noreply@forwardcarua.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "ЄДР: оновлення даних перевізників [skip netlify]"
          git pull --rebase -q origin main
          git push -q origin main
