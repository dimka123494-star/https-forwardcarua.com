name: Мін'юст — розвідка відкритих даних
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/minjust_probe.py', '.github/workflows/minjust-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/minjust_probe.py
      - run: |
          git config user.name "edr-bot"; git config user.email "noreply@forwardcarua.com"
          git add data/minjust-probe.txt; git diff --cached --quiet && exit 0
          git commit -m "Мін'юст: розвідка відкритих даних [skip netlify]"; git pull --rebase -q origin main; git push -q origin main
